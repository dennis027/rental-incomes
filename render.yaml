# Render Blueprint for the Django API on the free plan. Frankfurt sits next to
# the Neon database (aws eu-central-1).
#
# No Redis here: the workspace's one free Key Value instance is taken. The API
# runs as a single process (threads for concurrency) so its in-memory cache
# stays consistent, and Celery tasks run inline. To add Redis later, set
# REDIS_URL and raise WEB_CONCURRENCY; nothing else changes.
services:
  - type: web
    name: den-rent   # served at den-rent.onrender.com
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./rental-backend
    dockerfilePath: ./rental-backend/Dockerfile
    # Frontend-only commits don't redeploy the API
    buildFilter:
      paths:
        - rental-backend/**
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # asked for when the Blueprint is created
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:4200,https://dennis027.github.io
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_CMD_ARGS
        value: --threads 4
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
