# Render Blueprint: the Django API plus a Redis-compatible cache, both on the
# free plan. Frankfurt sits next to the Neon database (aws eu-central-1).
services:
  - type: web
    name: rental-managment-backend   # gives rental-managment-backend.onrender.com, which the frontend calls
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./rental-backend
    dockerfilePath: ./rental-backend/Dockerfile
    # Frontend-only commits don't redeploy the API
    buildFilter:
      paths:
        - rental-backend/**
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # asked for when the Blueprint is created
      - key: CORS_ALLOWED_ORIGINS
        value: https://dennis027.github.io
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rental-cache
          property: connectionString
      # Free plan has no worker process, so Celery tasks (emails) run inline
      - key: CELERY_ALWAYS_EAGER
        value: "True"
      # 512 MB of memory on the free plan
      - key: WEB_CONCURRENCY
        value: "2"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: keyvalue
    name: rental-cache
    plan: free
    region: frankfurt
    # Only cached pages and rate-limit counters live here; all safe to evict
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []   # reachable only from this Render account's services
