<div class="header">
  <h2>Reports</h2>
</div>

<mat-tab-group>
  <mat-tab label="Overview">
    <ng-template matTabContent>
      <app-financial-reports></app-financial-reports>
    </ng-template>
  </mat-tab>
  <mat-tab label="Financial">
    <ng-template matTabContent>
      <app-report-viewer [reports]="financialReports"></app-report-viewer>
    </ng-template>
  </mat-tab>
  <mat-tab label="Occupancy & Units">
    <ng-template matTabContent>
      <app-occupancy-reports></app-occupancy-reports>
    </ng-template>
  </mat-tab>
  <mat-tab label="Tenants">
    <ng-template matTabContent>
      <app-tenantscustomers-reports></app-tenantscustomers-reports>
    </ng-template>
  </mat-tab>
  <mat-tab label="Utilities & Maintenance">
    <ng-template matTabContent>
      <app-utilitymaintanace-reports></app-utilitymaintanace-reports>
    </ng-template>
  </mat-tab>
  <mat-tab label="Executive">
    <ng-template matTabContent>
      <app-executive-reports></app-executive-reports>
    </ng-template>
  </mat-tab>
</mat-tab-group>
